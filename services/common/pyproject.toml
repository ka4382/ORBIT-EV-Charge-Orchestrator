[project]
name = "orbit-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.6", "orjson>=3.10", "aiokafka[lz4]>=0.12", "fastavro>=1.9",
  "psycopg[binary,pool]>=3.2", "redis[hiredis]>=5.2", "pyyaml>=6.0", "structlog>=24.4",
  "opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28", "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "prometheus-client>=0.21", "mmh3>=5.0", "numpy>=2.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_common"]
