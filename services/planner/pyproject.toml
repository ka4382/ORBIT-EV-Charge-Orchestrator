[project]
name = "orbit-planner"
version = "0.1.0"
description = "ORBIT charge planner: Dijkstra routing, DP tariff schedule, depot smoothing"
requires-python = ">=3.11"
dependencies = ["orbit-common", "numpy>=2.1"]

[project.scripts]
orbit-planner = "orbit_planner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_planner"]
