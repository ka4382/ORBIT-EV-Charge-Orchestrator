[project]
name = "orbit-archiver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["orbit-common", "aiokafka>=0.12", "orjson>=3.10", "psycopg[binary,pool]>=3.2", "pyarrow>=18.0", "boto3>=1.35"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_archiver"]
