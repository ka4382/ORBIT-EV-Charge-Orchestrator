[project]
name = "orbit-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["orbit-common", "aiokafka[lz4]>=0.12", "orjson>=3.10", "prometheus-client>=0.21"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_ingest"]
