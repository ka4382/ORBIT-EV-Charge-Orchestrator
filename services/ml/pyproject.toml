[project]
name = "orbit-ml"
version = "0.1.0"
description = "ORBIT ML layer: range and SoH models, degradation embeddings (pgvector), Redis range coefficients"
requires-python = ">=3.11"
dependencies = ["orbit-common", "numpy>=2.1", "scikit-learn>=1.5", "joblib>=1.4", "psycopg[binary]>=3.2", "redis>=5.2"]

[project.scripts]
orbit-ml = "orbit_ml.__main__:main"

[dependency-groups]
dev = ["fakeredis>=2.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_ml"]
