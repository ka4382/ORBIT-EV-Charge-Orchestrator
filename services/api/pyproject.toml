[project]
name = "orbit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "orbit-common", "fastapi>=0.115", "uvicorn[standard]>=0.32", "pyjwt[crypto]>=2.9",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "python-multipart>=0.0.12", "orjson>=3.10",
  "redis>=5.2", "structlog>=24.4", "prometheus-client>=0.21",
  "opentelemetry-instrumentation-fastapi>=0.50b0", "lz4>=4.3", "anthropic>=1.11",
]
[dependency-groups]
dev = ["fakeredis[lua]>=2.26", "pytest-cov>=6.0", "httpx>=0.27", "testcontainers[postgres]>=4.8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_api"]
