[project]
name = "orbit-alert"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["orbit-common", "aiokafka[lz4]>=0.12", "orjson>=3.10", "redis>=5.2", "psycopg[binary,pool]>=3.2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["orbit_alert"]
