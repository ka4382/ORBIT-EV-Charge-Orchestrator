{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit
  annotations: {nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: orbit-tls}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: orbit-api, port: {name: http}}}}
          - {path: /ws,  pathType: Prefix, backend: {service: {name: orbit-api, port: {name: http}}}}
          - {path: /,    pathType: Prefix, backend: {service: {name: orbit-web, port: {name: http}}}}
{{- end }}
