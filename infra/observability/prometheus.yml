global: {scrape_interval: 5s, evaluation_interval: 15s}
scrape_configs:
  - job_name: orbit-services
    dns_sd_configs:
      - {names: ["ingest", "state", "alert", "archiver", "planner", "api"], type: A, port: 9100}
    relabel_configs:
      - {source_labels: [__meta_dns_name], target_label: service}
  - job_name: simulator
    dns_sd_configs: [{names: ["simulator"], type: A, port: 9101}]
  - job_name: redpanda
    static_configs: [{targets: ["redpanda:9644"]}]
    metrics_path: /public_metrics
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
