name: nightly-load-chaos
on:
  schedule: [{cron: "0 20 * * *"}]
  workflow_dispatch:
jobs:
  load-and-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/SIM_VEHICLES=100000/SIM_VEHICLES=20000/' .env
      - run: docker compose --profile sim up -d --build
      - run: sleep 90
      - uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/api.js --out json=tests/reports/k6.json
        env: {API_BASE: "http://localhost:8000"}
      - run: bash tests/chaos/kill_broker.sh
      - uses: actions/upload-artifact@v4
        with: {name: load-and-chaos, path: tests/reports/}
      - run: docker compose --profile sim down -v
        if: always()
